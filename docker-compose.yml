version: "3.9"

services:
  # ── FastAPI Backend ───────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: copilot_backend
    ports:
      - "8000:8000"
    # The image CMD is the production (no-reload) command. Local dev keeps
    # hot-reload, which works because ./backend/app is bind-mounted below.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000


    env_file:
      - .env
    volumes:
      - ./backend/app:/app/app
      - uploads_data:/app/uploads
      - chroma_data:/app/chroma_data
    depends_on:
      mongodb:
        condition: service_healthy
      chromadb:
        condition: service_started
    networks:
      - copilot_net
    restart: unless-stopped

  # ── Next.js Frontend ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: copilot_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - copilot_net
    restart: unless-stopped

  # ── ChromaDB Vector Store ─────────────────────────────────────
  chromadb:
    image: chromadb/chroma:0.5.23
    container_name: copilot_chromadb
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - ALLOW_RESET=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    networks:
      - copilot_net
    restart: unless-stopped

  # ── MongoDB ───────────────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: copilot_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - copilot_net
    restart: unless-stopped

  # ── Mongo Express (optional DB UI) ────────────────────────────
  mongo-express:
    image: mongo-express:1.0.2
    container_name: copilot_mongo_express
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongodb
      - ME_CONFIG_MONGODB_PORT=27017
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=admin123
    depends_on:
      - mongodb
    networks:
      - copilot_net
    profiles:
      - debug

volumes:
  uploads_data:
  chroma_data:
  mongo_data:

networks:
  copilot_net:
    driver: bridge
